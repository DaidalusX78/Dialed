<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Marc Bailey" />
  <title>Dialed - Chilli FM 91.5 Marbella</title>
  <link rel="icon" type="image/png" href="images/Dialed%20initial%20logo.png" />
  <style>
    :root {
      --primary: #ff2a44;
      --primary-hover: #e0203a;
      --bg: #0b0b0e;
      --card-bg: #16161a;
      --card-border: #24242b;
      --text: #ffffff;
      --text-muted: #95959e;
      --text-dim: #6c6c76;
      --accent-green: #00e676;
      --accent-amber: #ffab00;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 24px 20px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 12px;
      background: rgba(255, 42, 68, 0.14);
      color: var(--primary);
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 2px;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    /* Album Art Container */
    .art-container {
      position: relative;
      width: 160px;
      height: 160px;
      margin: 0 auto 16px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background: #0f0f13;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .art-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .art-image.loading {
      opacity: 0.5;
      transform: scale(0.98);
    }

    /* Now Playing Info Box */
    .now-playing-box {
      background: #0f0f13;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 16px;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .now-playing-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--primary);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.4); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }

    .track-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
      line-height: 1.3;
      word-break: break-word;
    }

    .track-artist {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.2;
    }

    /* Status Dot & Container */
    .status-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }

    .status-dot.active {
      background: var(--accent-green);
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.6);
    }

    .status-dot.buffering {
      background: var(--accent-amber);
      box-shadow: 0 0 8px rgba(255, 171, 0, 0.5);
    }

    .status-dot.offline {
      background: #e53935;
      box-shadow: 0 0 8px rgba(229, 57, 53, 0.5);
    }

    /* Main Play Button */
    .btn-main {
      background: var(--primary);
      color: #fff;
      border: none;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 42, 68, 0.35);
      transition: background 0.2s, transform 0.1s;
    }

    .btn-main:hover { background: var(--primary-hover); }
    .btn-main:active { transform: scale(0.98); }

    /* Action Buttons */
    .playlist-section {
      margin-top: 14px;
    }

    .btn-yt {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ffffff;
      background: #212124;
      border: 1px solid #333338;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .btn-yt:hover {
      background: #2b2b30;
      border-color: #44444a;
    }

    .btn-yt svg { flex-shrink: 0; }

    /* Secondary Controls / Drawers */
    .controls-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--card-border);
    }

    .drawer-toggle {
      font-size: 0.74rem;
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border-radius: 6px;
      transition: color 0.2s;
    }

    .drawer-toggle:hover { color: #fff; }

    .drawer {
      display: none;
      margin-top: 10px;
      text-align: left;
      background: #0f0f13;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      animation: fadeIn 0.2s ease;
    }

    .drawer.open { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* History List */
    .history-header {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 700;
    }

    .history-list {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 8px;
      border-radius: 8px;
      background: #16161a;
      font-size: 0.75rem;
      border: 1px solid #1f1f26;
    }

    .history-info {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      margin-right: 8px;
    }

    .history-title {
      color: #fff;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-artist {
      color: var(--text-muted);
      font-size: 0.7rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-yt-mini {
      background: #2a2a30;
      border: none;
      border-radius: 6px;
      color: #fff;
      padding: 4px 8px;
      font-size: 0.68rem;
      cursor: pointer;
      flex-shrink: 0;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-yt-mini:hover { background: #ff2a44; }

    /* Config Drawer */
    .config-drawer input {
      width: 100%;
      padding: 8px 10px;
      background: #16161a;
      border: 1px solid var(--card-border);
      color: #fff;
      border-radius: 8px;
      font-size: 0.75rem;
      margin-bottom: 8px;
    }

    .config-actions {
      display: flex;
      gap: 6px;
    }

    .config-actions button {
      flex: 1;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    .btn-save { background: var(--primary); color: #fff; }
    .btn-reset { background: #2a2a32; color: var(--text-muted); }
    .btn-reset:hover { color: #fff; }

    /* Footer */
    .footer {
      margin-top: 14px;
      font-size: 0.68rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="badge">
      <span class="pulse-dot"></span>
      91.5 FM Marbella
    </div>
    <h1>Chilli FM</h1>
    <p class="subtitle">Costa del Sol English Radio</p>

    <!-- Cover Art -->
    <div class="art-container">
      <img id="albumArt" class="art-image" src="images/Dialed%20initial%20logo.png" alt="Station Artwork" onerror="this.src=FALLBACK_ARTWORK" />
    </div>

    <!-- Now Playing Box -->
    <div class="now-playing-box">
      <div class="now-playing-label">
        <span class="pulse-dot"></span>
        Now Playing
      </div>
      <div id="trackTitle" class="track-title">Chilli FM 91.5</div>
      <div id="trackArtist" class="track-artist">Marbella Broadcast</div>
    </div>

    <audio id="radioPlayer" preload="none">
      <source src="https://stream.aiir.com/gzsyvjpqs4svv" type="audio/mpeg">
    </audio>

    <div class="status-container">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Ready to stream</span>
    </div>

    <button id="playBtn" class="btn-main" onclick="handlePlaybackToggle()">Listen Live</button>

    <div class="playlist-section">
      <button id="ytBtn" class="btn-yt" onclick="openYouTubeMusicSearch()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#ff0000">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
        <span id="ytBtnText">Add Track to YT Music</span>
      </button>
    </div>

    <!-- Secondary Controls / Toggles -->
    <div class="controls-row">
      <button class="drawer-toggle" onclick="toggleDrawer('historyDrawer')">
        <span>🕒</span> Recent Tracks (<span id="historyCount">0</span>)
      </button>
      <button class="drawer-toggle" onclick="toggleDrawer('configDrawer')">
        <span>⚙️</span> Settings
      </button>
    </div>

    <!-- Recently Played Drawer -->
    <div id="historyDrawer" class="drawer">
      <div class="history-header">Session History</div>
      <ul id="historyList" class="history-list">
        <li style="color: var(--text-dim); font-size: 0.72rem; text-align: center; padding: 10px;">
          Tracks will appear here as they play
        </li>
      </ul>
    </div>

    <!-- Stream URL Config Drawer -->
    <div id="configDrawer" class="drawer config-drawer">
      <input type="text" id="customUrlInput" placeholder="Stream URL (MP3/AAC)..." />
      <div class="config-actions">
        <button class="btn-save" onclick="saveCustomStream()">Save & Connect</button>
        <button class="btn-reset" onclick="resetDefaultStream()">Reset Default</button>
      </div>
    </div>

    <div class="footer">
      Dialed v0.03 • Created by Marc Bailey • Chilli FM Costa del Sol
    </div>
  </div>

  <script>
    const FALLBACK_ARTWORK = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Crect width='200' height='200' fill='%23121217'/%3E%3Ccircle cx='100' cy='100' r='50' fill='none' stroke='%23ff2a44' stroke-width='6' opacity='0.3'/%3E%3Ccircle cx='100' cy='100' r='30' fill='%23ff2a44' opacity='0.8'/%3E%3Cpath d='M75 160 Q100 135 125 160' fill='none' stroke='%2395959e' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E";
    const DEFAULT_STREAM_URL = "https://stream.aiir.com/gzsyvjpqs4svv";
    const METADATA_HISTORY_URL = "https://streaming-api.aiir.com/mounts/metadata/history/gzsyvjpqs4svv/?limit=1";
    const METADATA_LIVE_URL = "https://streaming-api.aiir.com/mounts/metadata/subscribe/gzsyvjpqs4svv";
    const DEFAULT_ARTWORK = "images/Dialed%20initial%20logo.png";

    const player = document.getElementById('radioPlayer');
    const playBtn = document.getElementById('playBtn');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const trackTitleEl = document.getElementById('trackTitle');
    const trackArtistEl = document.getElementById('trackArtist');
    const albumArtEl = document.getElementById('albumArt');
    const ytBtn = document.getElementById('ytBtn');
    const ytBtnText = document.getElementById('ytBtnText');
    const customUrlInput = document.getElementById('customUrlInput');
    const historyListEl = document.getElementById('historyList');
    const historyCountEl = document.getElementById('historyCount');

    let currentQuery = "Chilli FM Marbella";
    let currentRaw = "";
    let reconnectAttempts = 0;
    let reconnectTimer = null;
    let shouldBePlaying = false;
    let artCache = new Map();
    let trackHistory = [];

    // Load persisted track history from sessionStorage/localStorage
    try {
      const savedHistory = localStorage.getItem('dialed_track_history');
      if (savedHistory) {
        trackHistory = JSON.parse(savedHistory);
        renderHistory();
      }
    } catch (e) {
      trackHistory = [];
    }

    function getActiveStreamUrl() {
      const saved = localStorage.getItem('chilli_stream_url');
      if (saved && saved.includes('hotpeppermedia.es')) {
        localStorage.removeItem('chilli_stream_url');
        return DEFAULT_STREAM_URL;
      }
      return saved || DEFAULT_STREAM_URL;
    }

    /* ---------------- Audio Lifecycle & Reconnection ---------------- */

    player.addEventListener('playing', () => {
      reconnectAttempts = 0;
      statusDot.className = 'status-dot active';
      statusText.innerText = 'Streaming Live';
      playBtn.innerText = 'Pause Stream';
      updateMediaSessionPlaybackState('playing');
    });

    player.addEventListener('waiting', () => {
      statusDot.className = 'status-dot buffering';
      statusText.innerText = 'Buffering...';
    });

    player.addEventListener('pause', () => {
      if (!shouldBePlaying) {
        statusDot.className = 'status-dot';
        statusText.innerText = 'Stream paused';
        playBtn.innerText = 'Listen Live';
        updateMediaSessionPlaybackState('paused');
      }
    });

    player.addEventListener('error', () => {
      handleStreamError();
    });

    player.addEventListener('stalled', () => {
      if (shouldBePlaying && navigator.onLine) {
        handleStreamError();
      }
    });

    function handlePlaybackToggle() {
      if (player.paused) {
        shouldBePlaying = true;
        reconnectAttempts = 0;
        startPlayback();
      } else {
        shouldBePlaying = false;
        clearTimeout(reconnectTimer);
        player.pause();
      }
    }

    function startPlayback() {
      statusText.innerText = 'Connecting...';
      statusDot.className = 'status-dot buffering';
      player.src = getActiveStreamUrl();
      player.load();
      player.play().catch(err => {
        statusText.innerText = 'Tap Listen Live to play';
        console.warn('Playback request error:', err);
      });
    }

    function handleStreamError() {
      if (!shouldBePlaying) return;

      if (!navigator.onLine) {
        statusDot.className = 'status-dot offline';
        statusText.innerText = 'Network offline...';
        return;
      }

      reconnectAttempts++;
      const delay = Math.min(reconnectAttempts * 2000, 10000);
      statusDot.className = 'status-dot buffering';
      statusText.innerText = `Reconnecting (${reconnectAttempts})...`;

      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => {
        if (shouldBePlaying) {
          player.src = getActiveStreamUrl() + '?t=' + Date.now();
          player.load();
          player.play().catch(() => {});
        }
      }, delay);
    }

    window.addEventListener('online', () => {
      if (shouldBePlaying) {
        statusText.innerText = 'Online. Reconnecting...';
        startPlayback();
      } else {
        statusDot.className = 'status-dot';
        statusText.innerText = 'Ready to stream';
      }
    });

    window.addEventListener('offline', () => {
      statusDot.className = 'status-dot offline';
      statusText.innerText = 'Offline';
    });

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && shouldBePlaying && player.paused) {
        startPlayback();
      }
    });

    /* ---------------- Track Metadata & Parsing ---------------- */

    function updateNowPlaying(raw) {
      if (!raw || typeof raw !== 'string') return;
      raw = raw.trim();
      if (!raw || raw === currentRaw) return;
      currentRaw = raw;

      const cut = raw.indexOf(' - ');
      let title = raw;
      let artist = 'Chilli FM 91.5';

      if (cut > 0) {
        title = raw.slice(0, cut).trim();
        artist = raw.slice(cut + 3).trim();
      }

      trackTitleEl.textContent = title;
      trackArtistEl.textContent = artist || 'Marbella Broadcast';

      if (artist && artist !== 'Chilli FM 91.5' && artist !== 'Marbella Broadcast') {
        currentQuery = `${artist} ${title}`;
      } else {
        currentQuery = title;
      }

      const displayTitle = title.length > 22 ? title.slice(0, 20) + '…' : title;
      ytBtnText.textContent = `Add "${displayTitle}" to YT Music`;
      ytBtn.title = `Search "${currentQuery}" on YouTube Music`;

      // Add to Session History
      addToHistory(title, artist, currentQuery);

      // Fetch dynamic cover art
      fetchArtwork(artist, title);
    }

    /* ---------------- Dynamic Cover Art (iTunes API) ---------------- */

    async function fetchArtwork(artist, title) {
      if (!artist || artist === 'Chilli FM 91.5' || artist === 'Marbella Broadcast') {
        setArtwork(DEFAULT_ARTWORK);
        updateMediaSessionMetadata(title, artist, DEFAULT_ARTWORK);
        return;
      }

      // Check cache first
      const cacheKey = `${artist} - ${title}`.toLowerCase();
      if (artCache.has(cacheKey)) {
        const cached = artCache.get(cacheKey);
        setArtwork(cached);
        updateMediaSessionMetadata(title, artist, cached);
        return;
      }

      // Clean query: strip parenthesized text, featuring, remixes
      const cleanTitle = title.replace(/\(.*?\)|\[.*?\]/g, '').replace(/feat\..*$/i, '').trim();
      const cleanArtist = artist.replace(/feat\..*$/i, '').replace(/&.*$/, '').trim();
      const term = encodeURIComponent(`${cleanArtist} ${cleanTitle}`);

      albumArtEl.classList.add('loading');

      try {
        const res = await fetch(`https://itunes.apple.com/search?term=${term}&media=music&entity=song&limit=1`);
        if (res.ok) {
          const data = await res.json();
          if (data.results && data.results.length > 0 && data.results[0].artworkUrl100) {
            // Transform 100x100 to 600x600 high-res
            const highResArt = data.results[0].artworkUrl100.replace('100x100bb', '600x600bb');
            artCache.set(cacheKey, highResArt);
            setArtwork(highResArt);
            updateMediaSessionMetadata(title, artist, highResArt);
            return;
          }
        }
      } catch (err) {
        console.warn('Cover art lookup error:', err);
      } finally {
        albumArtEl.classList.remove('loading');
      }

      // Fallback if not found
      setArtwork(DEFAULT_ARTWORK);
      updateMediaSessionMetadata(title, artist, DEFAULT_ARTWORK);
    }

    function setArtwork(url) {
      if (albumArtEl.src !== url) {
        albumArtEl.src = url;
      }
    }

    /* ---------------- Media Session API ---------------- */

    function updateMediaSessionMetadata(title, artist, artworkUrl) {
      if (!('mediaSession' in navigator)) return;

      const artSrc = artworkUrl.startsWith('http') ? artworkUrl : new URL(artworkUrl, window.location.href).href;

      navigator.mediaSession.metadata = new MediaMetadata({
        title: title || 'Chilli FM 91.5',
        artist: artist || 'Marbella Broadcast',
        album: 'Chilli FM Costa del Sol',
        artwork: [
          { src: artSrc, sizes: '96x96', type: 'image/jpeg' },
          { src: artSrc, sizes: '256x256', type: 'image/jpeg' },
          { src: artSrc, sizes: '512x512', type: 'image/jpeg' }
        ]
      });
    }

    function updateMediaSessionPlaybackState(state) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.playbackState = state;
      }
    }

    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => {
        if (player.paused) handlePlaybackToggle();
      });
      navigator.mediaSession.setActionHandler('pause', () => {
        if (!player.paused) handlePlaybackToggle();
      });
      navigator.mediaSession.setActionHandler('stop', () => {
        shouldBePlaying = false;
        player.pause();
      });
    }

    /* ---------------- Recently Played History ---------------- */

    function addToHistory(title, artist, query) {
      if (!title || title === 'Chilli FM 91.5') return;

      // Avoid consecutive duplicate
      if (trackHistory.length > 0 && trackHistory[0].title === title && trackHistory[0].artist === artist) {
        return;
      }

      const item = {
        title,
        artist,
        query,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      trackHistory.unshift(item);
      if (trackHistory.length > 10) trackHistory.pop();

      try {
        localStorage.setItem('dialed_track_history', JSON.stringify(trackHistory));
      } catch (e) {}

      renderHistory();
    }

    function renderHistory() {
      historyCountEl.textContent = trackHistory.length;

      if (trackHistory.length === 0) {
        historyListEl.innerHTML = `
          <li style="color: var(--text-dim); font-size: 0.72rem; text-align: center; padding: 10px;">
            Tracks will appear here as they play
          </li>`;
        return;
      }

      historyListEl.innerHTML = trackHistory.map(item => `
        <li class="history-item">
          <div class="history-info">
            <div class="history-title" title="${item.title}">${item.title}</div>
            <div class="history-artist">${item.artist} • ${item.time}</div>
          </div>
          <a class="btn-yt-mini" href="https://music.youtube.com/search?q=${encodeURIComponent(item.query)}" target="_blank" rel="noopener">
            YT Music ↗
          </a>
        </li>
      `).join('');
    }

    /* ---------------- Drawers & Config ---------------- */

    function toggleDrawer(id) {
      const drawer = document.getElementById(id);
      const isOpen = drawer.classList.contains('open');

      // Close all drawers
      document.querySelectorAll('.drawer').forEach(d => d.classList.remove('open'));

      if (!isOpen) {
        drawer.classList.add('open');
        if (id === 'configDrawer') {
          customUrlInput.value = getActiveStreamUrl();
        }
      }
    }

    function saveCustomStream() {
      const url = customUrlInput.value.trim();
      if (url) {
        localStorage.setItem('chilli_stream_url', url);
        shouldBePlaying = true;
        startPlayback();
        toggleDrawer('configDrawer');
      }
    }

    function resetDefaultStream() {
      localStorage.removeItem('chilli_stream_url');
      customUrlInput.value = DEFAULT_STREAM_URL;
      shouldBePlaying = true;
      startPlayback();
      toggleDrawer('configDrawer');
    }

    function openYouTubeMusicSearch() {
      const encoded = encodeURIComponent(currentQuery);
      window.open(`https://music.youtube.com/search?q=${encoded}`, '_blank');
    }

    /* ---------------- Metadata Stream Initialization ---------------- */

    async function fetchCurrentTrack() {
      try {
        const res = await fetch(METADATA_HISTORY_URL);
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0 && data[0].title) {
            updateNowPlaying(data[0].title);
          }
        }
      } catch (err) {
        console.warn("Initial metadata fetch failed:", err);
      }
    }

    function initMetadataStream() {
      fetchCurrentTrack();

      if (!window.EventSource) {
        setInterval(fetchCurrentTrack, 15000);
        return;
      }

      try {
        const eventSource = new EventSource(METADATA_LIVE_URL);
        eventSource.onmessage = (event) => {
          try {
            const parsed = JSON.parse(event.data);
            if (parsed && parsed.streamTitle) {
              updateNowPlaying(parsed.streamTitle);
            }
          } catch (e) {
            console.error("Error parsing SSE metadata:", e);
          }
        };
        eventSource.onerror = () => {
          setTimeout(fetchCurrentTrack, 10000);
        };
      } catch (e) {
        console.warn("SSE initialization error:", e);
        setInterval(fetchCurrentTrack, 15000);
      }
    }

    // Initialize
    initMetadataStream();
  </script>
</body>
</html>
