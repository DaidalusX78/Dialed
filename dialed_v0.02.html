<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chilli FM 91.5 - Marbella</title>
  <style>
    :root {
      --primary: #ff2a44;
      --bg: #0b0b0e;
      --card-bg: #16161a;
      --card-border: #24242b;
      --text: #ffffff;
      --text-muted: #95959e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.7);
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255, 42, 68, 0.15);
      color: var(--primary);
      margin-bottom: 10px;
    }

    h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 2px; }
    .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px; }

    .now-playing-box {
      background: #0f0f13;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
      min-height: 76px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .now-playing-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .track-title { font-size: 1rem; font-weight: 700; color: #fff; margin-bottom: 2px; }
    .track-artist { font-size: 0.82rem; color: var(--text-muted); }

    .status-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
    }
    .status-dot.active { background: #00e676; box-shadow: 0 0 10px rgba(0, 230, 118, 0.5); }
    .status-dot.buffering { background: #ffab00; }

    .btn-main {
      background: var(--primary);
      color: #fff;
      border: none;
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(255, 42, 68, 0.35);
    }

    .btn-main:active { transform: scale(0.98); }

    /* Custom Stream URL Input Toggle */
    .config-toggle {
      margin-top: 14px;
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    .config-drawer {
      display: none;
      margin-top: 10px;
      text-align: left;
    }

    .config-drawer input {
      width: 100%;
      padding: 8px 10px;
      background: #0f0f13;
      border: 1px solid var(--card-border);
      color: #fff;
      border-radius: 8px;
      font-size: 0.75rem;
      margin-bottom: 6px;
    }

    .config-drawer button {
      background: #333;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      cursor: pointer;
      width: 100%;
    }

    .playlist-section {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--card-border);
    }

    .btn-yt {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      color: #ffffff;
      background: #212124;
      border: 1px solid #333338;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="player-card">
    <div class="badge">91.5 FM Marbella</div>
    <h1>Chilli FM</h1>
    <p class="subtitle">Costa del Sol English Radio</p>

    <div class="now-playing-box">
      <div class="now-playing-label">Now Playing</div>
      <div id="trackTitle" class="track-title">Chilli FM 91.5</div>
      <div id="trackArtist" class="track-artist">Marbella Broadcast</div>
    </div>

    <audio id="radioPlayer" preload="none">
      <source src="https://stream.aiir.com/gzsyvjpqs4svv" type="audio/mpeg">
    </audio>

    <div class="status-container">
      <div id="statusDot" class="status-dot"></div>
      <span id="statusText">Ready to stream</span>
    </div>

    <button id="playBtn" class="btn-main" onclick="handlePlaybackToggle()">Listen Live</button>

    <div class="config-toggle" onclick="toggleConfig()">Configure Stream URL</div>
    <div id="configDrawer" class="config-drawer">
      <input type="text" id="customUrlInput" placeholder="Paste extracted stream URL here..." />
      <button onclick="saveCustomStream()">Save & Connect</button>
    </div>

    <div class="playlist-section">
      <button id="ytBtn" class="btn-yt" onclick="openYouTubeMusicSearch()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#ff0000">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
        </svg>
        <span id="ytBtnText">Add Track to YT Music</span>
      </button>
    </div>
  </div>

  <script>
    const player = document.getElementById('radioPlayer');
    const playBtn = document.getElementById('playBtn');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const trackTitleEl = document.getElementById('trackTitle');
    const trackArtistEl = document.getElementById('trackArtist');
    const ytBtnText = document.getElementById('ytBtnText');
    const customUrlInput = document.getElementById('customUrlInput');

    let currentQuery = "Chilli FM Marbella";

    // Load saved stream or default
    function getActiveStreamUrl() {
      const saved = localStorage.getItem('chilli_stream_url');
      if (saved && saved.includes('hotpeppermedia.es')) {
        localStorage.removeItem('chilli_stream_url');
        return "https://stream.aiir.com/gzsyvjpqs4svv";
      }
      return saved || "https://stream.aiir.com/gzsyvjpqs4svv";
    }

    player.addEventListener('playing', () => {
      statusDot.className = 'status-dot active';
      statusText.innerText = 'Streaming Live';
      playBtn.innerText = 'Pause Stream';
    });

    player.addEventListener('waiting', () => {
      statusDot.className = 'status-dot buffering';
      statusText.innerText = 'Buffering...';
    });

    player.addEventListener('pause', () => {
      statusDot.className = 'status-dot';
      statusText.innerText = 'Stream paused';
      playBtn.innerText = 'Listen Live';
    });

    player.addEventListener('error', () => {
      statusDot.className = 'status-dot';
      statusText.innerText = 'Playback failed. Check stream URL.';
      playBtn.innerText = 'Retry';
    });

    function handlePlaybackToggle() {
      if (player.paused) {
        player.src = getActiveStreamUrl();
        statusText.innerText = 'Connecting...';
        statusDot.className = 'status-dot buffering';
        player.load();
        player.play().catch(err => {
          statusText.innerText = 'Tap Listen Live to play';
          console.warn(err);
        });
      } else {
        player.pause();
      }
    }

    function toggleConfig() {
      const drawer = document.getElementById('configDrawer');
      drawer.style.display = drawer.style.display === 'block' ? 'none' : 'block';
      customUrlInput.value = getActiveStreamUrl();
    }

    function saveCustomStream() {
      const url = customUrlInput.value.trim();
      if (url) {
        localStorage.setItem('chilli_stream_url', url);
        player.pause();
        player.src = url;
        player.load();
        player.play();
        toggleConfig();
      }
    }

    function openYouTubeMusicSearch() {
      const encoded = encodeURIComponent(currentQuery);
      window.open(`https://music.youtube.com/search?q=${encoded}`, '_blank');
    }

    function updateNowPlaying(raw) {
      if (!raw || typeof raw !== 'string') return;
      raw = raw.trim();
      if (!raw) return;

      const cut = raw.indexOf(' - ');
      let title = raw;
      let artist = 'Chilli FM 91.5';

      if (cut > 0) {
        title = raw.slice(0, cut).trim();
        artist = raw.slice(cut + 3).trim();
      }

      trackTitleEl.textContent = title;
      trackArtistEl.textContent = artist || 'Marbella Broadcast';

      if (artist && artist !== 'Chilli FM 91.5' && artist !== 'Marbella Broadcast') {
        currentQuery = `${artist} ${title}`;
      } else {
        currentQuery = title;
      }
      const displayTitle = title.length > 22 ? title.slice(0, 20) + '…' : title;
      ytBtnText.textContent = `Add "${displayTitle}" to YT Music`;
      document.getElementById('ytBtn').title = `Search "${currentQuery}" on YouTube Music`;
    }

    async function fetchCurrentTrack() {
      try {
        const res = await fetch("https://streaming-api.aiir.com/mounts/metadata/history/gzsyvjpqs4svv/?limit=1");
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0 && data[0].title) {
            updateNowPlaying(data[0].title);
          }
        }
      } catch (err) {
        console.warn("Initial metadata fetch failed:", err);
      }
    }

    function initMetadataStream() {
      fetchCurrentTrack();

      if (!window.EventSource) {
        setInterval(fetchCurrentTrack, 15000);
        return;
      }

      try {
        const eventSource = new EventSource("https://streaming-api.aiir.com/mounts/metadata/subscribe/gzsyvjpqs4svv");
        eventSource.onmessage = (event) => {
          try {
            const parsed = JSON.parse(event.data);
            if (parsed && parsed.streamTitle) {
              updateNowPlaying(parsed.streamTitle);
            }
          } catch (e) {
            console.error("Error parsing SSE metadata:", e);
          }
        };
        eventSource.onerror = () => {
          setTimeout(fetchCurrentTrack, 10000);
        };
      } catch (e) {
        console.warn("SSE initialization error:", e);
        setInterval(fetchCurrentTrack, 15000);
      }
    }

    // Start listening for live track metadata
    initMetadataStream();
  </script>
</body>
</html>
